<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>برنامه‌ریز انتخاب واحد</title>
    <script>
      // جلوگیری از فلش تم اشتباه (FOUC): قبل از اولین رندر، تم ذخیره‌شده اعمال شود
      ;(function () {
        try {
          var raw = localStorage.getItem('class-planning-v1')
          var theme = 'system'
          if (raw) {
            var t = JSON.parse(raw)?.state?.settings?.theme
            if (t === 'light' || t === 'dark' || t === 'system') theme = t
          }
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
